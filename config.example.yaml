version: 1

# Relative project names are created and looked up here.
projects_dir: ~/.local/vidpp/projects

# Optional. Omit this to keep final videos in each project's output directory.
# output_file_dir: ~/Videos

# Optional subtitle placement, also supported in each project's config.yaml.
# Choose a relative vertical offset OR an absolute rectangle, never both.
# Negative relative_y moves up by a fraction of the output height.
# subtitles:
#   relative_y: -0.10
# Rectangle coordinates are output pixels from the top-left corner.
# subtitles:
#   area: {top: 700, left: 60, right: 660, bottom: 1000}
# Project subtitles: {} restores template/default placement.

transcription:
  engine: whisper  # Or crisperwhisper for optional verbatim transcription.
  model: turbo
  recovery_model: turbo  # Use large-v3 for the strongest targeted recovery pass.
  crisper_backend: auto  # auto, transformers, or ct2; only used by CrisperWhisper.
  language: en  # Use "auto" to detect the spoken language.
  phrases:
    - VidPP
    - OneRSS
    - end-to-end encryption
