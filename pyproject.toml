[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vidpp"
version = "0.1.0"
description = "Local, deterministic social-video post-processing"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0", "Pillow>=10.0"]

[project.scripts]
vidpp = "vidpp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
